# Full stack: PostgreSQL + FastAPI backend + React frontend (nginx).
#   cp .env.example .env   (then set SECRET_KEY and POSTGRES_PASSWORD)
#   docker compose up --build
#   open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skillgap
      POSTGRES_USER: skillgap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillgap -d skillgap"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://skillgap:${POSTGRES_PASSWORD:-change-me-db-password}@db:5432/skillgap
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ENVIRONMENT: production
      AUTO_CREATE_TABLES: "false"
      CORS_ORIGINS: http://localhost:8080
      PRELOAD_MODELS: "true"
    volumes:
      - uploads:/app/backend/var
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads:
