[project]
name = "skillgap-nlp-backend"
version = "1.0.0"
description = "SkillGap-NLP: deep-learning-based skill gap analysis for resumes and job descriptions"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
